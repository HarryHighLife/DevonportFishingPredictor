
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Unpack Android project
        run: |
          mkdir -p source
          unzip -q DevonportFishingPredictor_Live_MVP.zip -d source
          test -d source/DevonportFishingPredictor_Live_MVP

      - name: Install Gradle 8.9
        run: |
          curl -L --fail -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        working-directory: source/DevonportFishingPredictor_Live_MVP
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Devonport-Fishing-Predictor-APK
          path: source/DevonportFishingPredictor_Live_MVP/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
